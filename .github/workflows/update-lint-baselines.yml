name: Update lint baselines

on:
  repository_dispatch:
    types: [update-lint-baselines]
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  update-lint-baselines:
    if: github.repository == 'FossifyOrg/Voice-Recorder'
    uses: FossifyOrg/.github/.github/workflows/update-lint-baselines.yml@main
    secrets: inherit
